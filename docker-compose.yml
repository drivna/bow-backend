services:
  flask-app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=run.py
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=local
      - DB_NAME=bow_db
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - flask-network

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
      POSTGRES_DB: bow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flask-network

networks:
  flask-network:
    driver: bridge

volumes:
  postgres_data:   